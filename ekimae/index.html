<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a1d">
<title>駅前ビル飯 — 大阪駅前ビル 飲食店マップ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="駅前ビル飯">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">駅前ビル飯</h1>
    <div class="topbar-actions">
      <button id="btn-add" class="icon-btn" title="店を追加">＋</button>
      <button id="btn-menu" class="icon-btn" title="メニュー">≡</button>
    </div>
  </div>
  <div class="searchwrap">
    <input id="q" type="search" inputmode="search" placeholder="店名・カテゴリ・タグ・メモで検索" autocomplete="off">
    <button id="q-clear" class="q-clear" hidden>×</button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-view="list" role="tab">リスト</button>
    <button class="tab" data-view="map" role="tab">マップ</button>
  </nav>
</header>

<div class="filterbar">
  <button id="btn-filters" class="filtertoggle" type="button" aria-expanded="false" aria-controls="filters">
    絞り込み<span id="f-count" class="fcount" hidden></span><span class="caret">▾</span>
  </button>
  <label class="sortwrap">並び
    <select id="sort">
      <option value="default">ビル・フロア順</option>
      <option value="rating">星が高い順</option>
      <option value="name">名前順</option>
      <option value="recent">最近見た順</option>
    </select>
  </label>
  <button id="btn-reset" class="linkbtn">クリア</button>
</div>

<section id="filters" class="filters" hidden>
  <div class="filter-row">
    <span class="filter-label">ビル</span>
    <div class="chips" id="f-building"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">フロア</span>
    <div class="chips" id="f-floor"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">種類</span>
    <div class="chips" id="f-category"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">タグ</span>
    <div class="chips" id="f-tag"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">条件</span>
    <div class="chips" id="f-misc"></div>
  </div>
</section>

<main>
  <p id="count" class="count"></p>
  <div id="view-list" class="view"></div>
  <div id="view-map" class="view" hidden></div>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
