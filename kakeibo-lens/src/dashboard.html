<title>家計簿レンズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: sticky ledger header + one scoped period switcher; content in a 12-col grid that collapses to one column; bottom tab bar on phones. */
:root {
  --bg: #f2f5f3;
  --surface: #fcfdfc;
  --surface-2: #e9eeeb;
  --fg: #13201b;
  --fg-2: #4b5853;
  --muted: #7f8b86;
  --line: #dde4e0;
  --line-strong: #c3ccc7;
  --accent: #0e6a54;
  --accent-ink: #ffffff;
  --accent-soft: #d9ede6;
  --rule: #b8463a;
  --up: #b42f2f;
  --down: #1d7334;
  --warn: #9a6400;
  --st-good: #0ca30c;
  --st-warn: #fab219;
  --st-serious: #ec835a;
  --st-critical: #d03b3b;
  --seq: #2a78d6;
  --div-up: #e34948;
  --div-down: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --sother: #aab2ae;
  --shadow: 0 1px 2px rgba(19,32,27,.06), 0 4px 16px rgba(19,32,27,.05);
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  --r: 10px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1311; --surface: #151c19; --surface-2: #1c2521; --fg: #edf3f0; --fg-2: #b6c2bd; --muted: #85918c;
    --line: #25302b; --line-strong: #34413b; --accent: #43b896; --accent-ink: #04140e; --accent-soft: #173a2f;
    --rule: #e0796b; --up: #ff8a80; --down: #5fd17f; --warn: #f0b84a;
    --seq: #3987e5; --div-up: #e66767; --div-down: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --sother: #5b6560; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1311; --surface: #151c19; --surface-2: #1c2521; --fg: #edf3f0; --fg-2: #b6c2bd; --muted: #85918c;
  --line: #25302b; --line-strong: #34413b; --accent: #43b896; --accent-ink: #04140e; --accent-soft: #173a2f;
  --rule: #e0796b; --up: #ff8a80; --down: #5fd17f; --warn: #f0b84a;
  --seq: #3987e5; --div-up: #e66767; --div-down: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --sother: #5b6560; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sub { color: var(--fg-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; padding: 10px var(--gutter); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 17px; }
.brand .badge { font-size: 11px; color: var(--fg-2); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.brand .badge.sample { color: var(--warn); border-color: currentColor; }
.period { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.period button.step { width: 32px; height: 32px; border: 0; background: none; border-radius: 999px; cursor: pointer; font-size: 16px; color: var(--fg-2); }
.period button.step:hover:not(:disabled) { background: var(--surface-2); }
.period button.step:disabled { opacity: .3; cursor: default; }
.period .pick { position: relative; padding: 0 6px; font-weight: 600; font-size: 15px; white-space: nowrap; }
.period .pick select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2); }
.btn.danger { color: var(--up); border-color: color-mix(in oklab, var(--up) 45%, transparent); }
.btn.small { padding: 3px 9px; font-size: 12.5px; border-radius: 6px; }
.btn:disabled { opacity: .45; cursor: default; }

.tabs { max-width: 1180px; margin: 0 auto; padding: 0 var(--gutter); display: flex; gap: 4px; }
.tabs button { border: 0; background: none; padding: 8px 12px 10px; cursor: pointer; color: var(--fg-2); font-weight: 500; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.tabs svg { width: 18px; height: 18px; }

main { max-width: 1180px; margin: 0 auto; padding-inline: var(--gutter); padding-block: 20px 48px; }

@media (max-width: 720px) {
  .top-in { padding-block: 8px; gap: 8px; }
  .brand h1 { font-size: 15px; }
  .hide-sm { display: none !important; }
  .tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; max-width: none; padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; gap: 0; }
  .tabs button { flex-direction: column; gap: 1px; font-size: 10.5px; padding: 6px 4px; border-bottom: 0; flex: 1; border-radius: 8px; }
  .tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
  main { padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (min-width: 721px) { .tabs svg { display: none; } }

/* ---------- generic blocks ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; }
@media (max-width: 960px) { .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-h h2 { font-size: 15px; }
.panel-h .hint { font-size: 12px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }
.seg button:disabled { opacity: .35; cursor: default; }
select.sel, input.inp { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 5px 9px; min-width: 0; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); cursor: pointer; }
.filters { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }

/* ---------- overview hero ---------- */
.hero { display: grid; gap: 14px; }
.hero .label { font-size: 13px; color: var(--fg-2); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hero .big { font-size: clamp(36px, 7vw, 52px); font-weight: 600; line-height: 1.05; letter-spacing: -.01em; }
.hero .rule { height: 4px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); width: min(260px, 70%); opacity: .8; }
.deltas { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.chip b { font-weight: 600; color: var(--fg); }
.chip.up b { color: var(--up); } .chip.down b { color: var(--down); }
.tiles { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tile { background: var(--surface); padding: 10px 12px; min-width: 0; flex: 1 1 124px; }
.tile .k { font-size: 12px; color: var(--fg-2); }
.tile .v { font-size: 19px; font-weight: 600; }
.tile .d { font-size: 11.5px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }

/* ---------- breakdown list ---------- */
.blist { display: flex; flex-direction: column; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) auto 96px; grid-template-areas: "name amt spark" "bar delta spark"; gap: 2px 14px; align-items: center; padding: 10px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
.brow:first-child { border-top: 0; }
.brow:hover { background: color-mix(in oklab, var(--surface-2) 60%, transparent); }
.brow .nm { grid-area: name; display: flex; align-items: center; gap: 8px; min-width: 0; font-weight: 500; }
.brow .nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .amt { grid-area: amt; text-align: right; font-weight: 600; }
.brow .dl { grid-area: delta; text-align: right; font-size: 12px; white-space: nowrap; }
.brow .bar { grid-area: bar; height: 8px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; }
.brow .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
.brow .bar .bud { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .6; }
.brow .sp { grid-area: spark; }
.brow.sub { padding-left: 26px; cursor: default; }
.brow.sub .nm { font-weight: 400; font-size: 13px; color: var(--fg-2); }
.brow.sub .amt { font-weight: 500; font-size: 13px; }
.brow .caret { width: 14px; color: var(--muted); font-size: 10px; transition: transform .15s; display: inline-block; text-align: center; }
.brow.open .caret { transform: rotate(90deg); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.up { color: var(--up); } .down { color: var(--down); }
@media (max-width: 520px) { .brow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name amt" "bar delta"; } .brow .sp { display: none; } }

/* ---------- insights ---------- */
.ins { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ins:first-child { border-top: 0; padding-top: 2px; }
.ins .stripe { border-radius: 2px; }
.ins .tt { font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
.ins .tt .ic { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; color: var(--fg); background: var(--surface-2); white-space: nowrap; }
.ins .dd { font-size: 12.5px; color: var(--fg-2); }
.ins button.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--muted); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .base-l { stroke: var(--line-strong); stroke-width: 1; shape-rendering: crispEdges; }
.chart .lbl-strong { fill: var(--fg); font-weight: 600; }
.chart .xhair { stroke: var(--fg-2); stroke-width: 1; opacity: .5; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .lk { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.legend .bk { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 8px 10px; font-size: 12px; min-width: 150px; max-width: 280px; }
.tip .th { font-weight: 600; margin-bottom: 4px; color: var(--fg); }
.tip .tr { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.tip .tr .k { color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip .tr .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
.tip .tr .key { width: 12px; height: 2px; border-radius: 1px; }
.tip .tr.tot { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }

/* ---------- matrix ---------- */
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.mx { border-collapse: separate; border-spacing: 0; font-size: 12.5px; min-width: 100%; }
table.mx th, table.mx td { padding: 6px 8px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--line); }
table.mx thead th { font-weight: 500; color: var(--muted); font-size: 11.5px; position: sticky; top: 0; background: var(--surface); }
table.mx th.rh { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; font-weight: 500; color: var(--fg); max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
table.mx thead th.rh { z-index: 2; }
table.mx td.c { cursor: pointer; }
table.mx td.c:hover { outline: 1px solid var(--fg-2); outline-offset: -1px; }
table.mx tr.sub th.rh { padding-left: 22px; font-weight: 400; color: var(--fg-2); }
table.mx tr.tot th, table.mx tr.tot td { font-weight: 600; border-top: 1px solid var(--line-strong); }
table.mx td.agg { color: var(--fg-2); background: var(--surface); }
table.mx tr.l0 th.rh { cursor: pointer; }
table.mx .avg { border-right: 1px solid var(--line-strong); }
@media (max-width: 720px) { table.mx .sumc { display: none; } table.mx th.rh { max-width: 112px; } }
.scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.scale .ramp { width: 120px; height: 8px; border-radius: 4px; }

/* ---------- diverging compare ---------- */
.dv { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) auto; gap: 4px 12px; align-items: center; }
.dv .h { font-size: 11.5px; color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.dv .lab { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.dv .lab small { color: var(--muted); }
.dv .track { position: relative; height: 18px; }
.dv .track .axis { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
.dv .track i { position: absolute; top: 4px; height: 10px; }
.dv .track i.pos { left: 50%; border-radius: 0 4px 4px 0; background: var(--div-up); }
.dv .track i.neg { right: 50%; border-radius: 4px 0 0 4px; background: var(--div-down); }
.dv .val { text-align: right; font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dv .val small { display: block; color: var(--muted); font-size: 11px; }
@media (max-width: 520px) { .dv { grid-template-columns: minmax(0, 1fr) auto; } .dv .track { grid-column: 1 / -1; order: 0; } .dv .h.mid { display: none; } }

/* ---------- ranking / list ---------- */
.rk { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.rk:first-child { border-top: 0; }
.rk .n { color: var(--muted); font-size: 12px; text-align: right; }
.rk .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rk .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.rk .meta { grid-column: 2 / -1; display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--muted); }
.rk .meta .bar { flex: 1; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; min-width: 40px; }
.rk .meta .bar i { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.pill { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); white-space: nowrap; }
.pill.warn { background: color-mix(in oklab, var(--st-warn) 22%, transparent); color: var(--warn); }
.pill.ex { background: none; border: 1px dashed var(--line-strong); }

.tx { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 0 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; }
.tx .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tx .c { min-width: 0; }
.tx .c .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.tx .c .m { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tx .a { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx .a.inc { color: var(--down); }
.tx.skip { opacity: .55; }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { font-size: 11px; color: var(--muted); text-align: center; }
.cal .day { aspect-ratio: 1 / .82; max-width: 100%; border-radius: 6px; padding: 4px 5px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid transparent; cursor: pointer; min-width: 0; background: var(--surface-2); }
.cal .day .dn { font-size: 11px; line-height: 1; }
.cal .day .dv { font-size: 11px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; line-height: 1; overflow: hidden; white-space: nowrap; }
.cal .day.out { visibility: hidden; }
.cal .day.sel { border-color: var(--fg); }
.cal .day.future { opacity: .4; cursor: default; }
.wdbars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; height: 70px; margin-top: 12px; }
.wdbars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 2px; font-size: 10.5px; color: var(--muted); }
.wdbars i { width: min(22px, 70%); background: var(--s1); border-radius: 4px 4px 0 0; display: block; }

/* ---------- settings ---------- */
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 22px 16px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.fetch { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 12px; }
.fetch .steps li { line-height: 2; }
.fetch textarea { background: var(--surface); resize: vertical; }
.steps { margin: 0; padding-left: 1.3em; color: var(--fg-2); font-size: 13px; display: grid; gap: 4px; text-align: left; }
.catgrp { border-top: 1px solid var(--line); padding: 10px 0; }
.catgrp:first-child { border-top: 0; }
.catgrp h3 { font-size: 13.5px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.catrow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 3px 0 3px 18px; font-size: 13px; flex-wrap: wrap; }
.mlist .mi { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
.mlist .mi:first-child { border-top: 0; }
.mlist .mi .grow { flex: 1; min-width: 120px; }

<script type="text/plain" id="mf-bookmarklet">

var old = document.getElementById('kl-panel'); if (old) old.remove();
var box = document.createElement('div'); box.id = 'kl-panel';
box.style.cssText = 'position:fixed;z-index:2147483647;top:16px;right:16px;width:340px;max-width:calc(100vw - 32px);background:#fcfdfc;color:#13201b;border:1px solid #c3ccc7;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:16px;font:14px/1.6 system-ui,-apple-system,sans-serif;text-align:left';

row.appendChild(el('span', '', '取得する期間'));

[3, 6, 12, 24, 36].forEach(function (n) { var o = el('option', '', '直近' + n + 'か月'); o.value = n; if (n === 12) o.selected = true; sel.appendChild(o); });
row.appendChild(sel); box.appendChild(row);

<script>
'use strict';
/* ===================================================================
   家計簿レンズ — マネーフォワード ME の入出金CSVを読み込む分析ダッシュボード
   保存先: claude.ai 上では artifact の db（オーナーのみ読み書き）、
           それ以外ではブラウザの localStorage。
   =================================================================== */

const APP_KEY = 'kakeibo-lens.v1';
const UI_KEY = 'kakeibo-lens.ui.v1';
const DEFAULT_FIXED_L = new Set(['住宅', '水道・光熱費', '通信費', '保険', '税・社会保障']);
const DEFAULT_EXCLUDE = new Set(['その他/会社経費', 'その他/立替金']);
const SPECIAL_L = '特別な支出';
const NOT_EXPENSE_L = new Set(['収入']);
const SLOTS = 7; // top-7 categories get a hue, the rest fold into その他
const WD = ['日', '月', '火', '水', '木', '金', '土'];

/* ------------------------------------------------------------------ utils */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('--')) e.style.setProperty(k, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  append(e, kids);
  return e;
}
function append(e, kids) {
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) { const v = attrs[k]; if (v == null) continue; if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const c of kids.flat(Infinity)) if (c) e.appendChild(c);
  return e;
}
const pad = n => String(n).padStart(2, '0');
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => a.length ? sum(a) / a.length : 0;
function sd(a) { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(sum(a.map(x => (x - m) ** 2)) / (a.length - 1)); }
function median(a) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const i = s.length >> 1; return s.length % 2 ? s[i] : (s[i - 1] + s[i]) / 2; }
const yen = n => (n < -0.5 ? '−' : '') + '¥' + Math.round(Math.abs(n)).toLocaleString('ja-JP');
const signed = n => (Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : '±') + '¥' + Math.round(Math.abs(n)).toLocaleString('ja-JP');
function man(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 10000) { const v = a / 10000; return s + (v >= 100 ? Math.round(v) : +v.toFixed(v >= 10 ? 0 : 1)) + '万'; }
  if (a >= 1000) return s + (+(a / 1000).toFixed(1)) + '千';
  return s + Math.round(a);
}
const pct = (a, b) => b ? Math.round((a / b - 1) * 100) : null;
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

/* -------------------------------------------------------------- periods */
// 期間キー 'YYYY-MM'。月の開始日が1日以外なら、その月の「開始日〜翌月開始日前日」を翌月の期間として数える（例: 25日開始 → 10月 = 9/25〜10/24）。
function startDay() { return S.settings.startDay || 1; }
function periodOf(d) {
  let y = +d.slice(0, 4), m = +d.slice(5, 7); const day = +d.slice(8, 10), s = startDay();
  if (s > 1 && day >= s) { m++; if (m > 12) { m = 1; y++; } }
  return y + '-' + pad(m);
}
function addP(p, k) { let y = +p.slice(0, 4), m = +p.slice(5, 7) - 1 + k; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + pad(m + 1); }
function pRange(p) {
  const y = +p.slice(0, 4), m = +p.slice(5, 7), s = startDay();
  if (s === 1) return [new Date(y, m - 1, 1), new Date(y, m, 0)];
  return [new Date(y, m - 2, s), new Date(y, m - 1, s - 1)];
}
const DAY = 86400000;
function pDays(p) { const [a, b] = pRange(p); return Math.round((b - a) / DAY) + 1; }
function dateOf(d) { return new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)); }
function dayIdx(d, p) { return Math.round((dateOf(d) - pRange(p)[0]) / DAY); } // 0-based
const ymd = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
const md = dt => (dt.getMonth() + 1) + '/' + dt.getDate();
function pLabel(p, short) {
  const y = +p.slice(0, 4), m = +p.slice(5, 7);
  if (short) return m + '月';
  return y + '年' + m + '月' + (startDay() > 1 ? '度' : '');
}
function pSpan(p) { const [a, b] = pRange(p); return md(a) + '〜' + md(b); }
function todayStr() { return ymd(new Date()); }

/* ---------------------------------------------------------------- state */
const S = {
  months: {},          // 'YYYY-MM'(暦月) -> [row]
  parts: {},           // cloud: 暦月 -> 保存済みドキュメント数
  settings: defaultSettings(),
  sample: null,        // サンプル表示中の months
  backend: null,
  loaded: false,
  view: 'overview',
  period: null,
  m: null,             // derived model
  ui: Object.assign({
    trendRange: 12, trendMode: 'L', trendL: '', includeSpecial: true, mxMode: 'amount',
    cmp: 'prev', cmpLevel: 'M', merchRange: 1, q: '', fL: '', showSkipped: false, txLimit: 80,
  }, lsGet(UI_KEY) || {}),
  open: new Set(),     // overview で開いている大項目
  fDay: null,          // 明細の日付フィルタ
};
const saveUI = debounce(() => {
  const { trendRange, trendMode, trendL, includeSpecial, mxMode, cmp, cmpLevel, merchRange, showSkipped } = S.ui;
  lsSet(UI_KEY, { trendRange, trendMode, trendL, includeSpecial, mxMode, cmp, cmpLevel, merchRange, showSkipped, view: S.view });
}, 300);
function defaultSettings() { return { v: 1, startDay: 1, cat: {}, budgets: {} }; }

/* ------------------------------------------------------- classification */
function catMode(L, M) {
  const o = S.settings.cat[L + '/' + M];
  if (o) return o;
  if (DEFAULT_EXCLUDE.has(L + '/' + M)) return 'ex';
  if (DEFAULT_FIXED_L.has(L)) return 'fixed';
  return 'var';
}
// skip: 計算対象外・振替 / income / ex: 自分で除外 / fixed / var / special
function kindOf(r) {
  if (r.t !== 1 || r.f === 1) return 'skip';
  if (NOT_EXPENSE_L.has(r.L) || (r.a > 0 && r.L === '未分類')) return 'income';
  const mode = catMode(r.L, r.M);
  if (mode === 'ex') return 'ex';
  if (mode === 'fixed') return 'fixed';
  if (r.L === SPECIAL_L) return 'special';
  return 'var';
}
function merchantKey(r) {
  if (r.inst === 'Amazon.co.jp' && !/^(返金|配送料|ポイント|ギフト)/.test(r.c)) return 'Amazon';
  let s = (r.c || '').normalize('NFKC');
  s = s.replace(/\/(NFC|カード|iD|QP|QUICPay)$/i, '').replace(/\(再計算\)/g, '').replace(/\s*\(W\)/g, '');
  s = s.replace(/\s+\d{3,}$/, '').replace(/\s+/g, ' ').trim();
  return s || r.c || '（不明）';
}
const isExp = k => k === 'fixed' || k === 'var' || k === 'special';

/* ---------------------------------------------------------------- model */
function newBucket() { return { exp: 0, inc: 0, fixed: 0, var: 0, special: 0, ex: 0, n: 0, L: new Map() }; }
const EMPTY = newBucket();
function buildModel() {
  const months = S.sample || S.months;
  const tx = [];
  for (const k in months) for (const r of months[k]) tx.push(r);
  tx.sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : 0));
  const P = new Map(), totL = new Map(), totM = new Map(), tree = new Map();
  let minD = null, maxD = null;
  for (const r of tx) {
    r.p = periodOf(r.d); r.k = kindOf(r); r.mk = merchantKey(r); r.v = -r.a;
    if (!minD || r.d < minD) minD = r.d;
    if (!maxD || r.d > maxD) maxD = r.d;
    if (!tree.has(r.L)) tree.set(r.L, new Set());
    tree.get(r.L).add(r.M);
    let b = P.get(r.p); if (!b) { b = newBucket(); P.set(r.p, b); }
    b.n++;
    if (r.k === 'income') { b.inc += r.a; continue; }
    if (r.k === 'ex') { b.ex += r.v; continue; }
    if (!isExp(r.k)) continue;
    b.exp += r.v; b[r.k] += r.v;
    let l = b.L.get(r.L); if (!l) { l = { v: 0, M: new Map() }; b.L.set(r.L, l); }
    l.v += r.v; l.M.set(r.M, (l.M.get(r.M) || 0) + r.v);
    totL.set(r.L, (totL.get(r.L) || 0) + r.v);
    const mk = r.L + '/' + r.M; totM.set(mk, (totM.get(mk) || 0) + r.v);
  }
  const periods = [];
  if (minD) { const end = periodOf(maxD); for (let p = periodOf(minD); p <= end; p = addP(p, 1)) periods.push(p); }
  const rankL = [...totL.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const slotL = new Map(rankL.slice(0, SLOTS).map((L, i) => [L, i + 1]));
  const rankM = new Map();
  for (const L of rankL) rankM.set(L, [...totM.entries()].filter(([k]) => k.startsWith(L + '/')).sort((a, b) => b[1] - a[1]).map(([k]) => k.slice(L.length + 1)));
  S.m = { tx, P, periods, rankL, slotL, rankM, tree, minD, maxD };
  if (!S.period || !periods.includes(S.period)) S.period = periods[periods.length - 1] || null;
}
const B = p => S.m.P.get(p) || EMPTY;
const vL = (p, L) => { const l = B(p).L.get(L); return l ? l.v : 0; };
const vM = (p, L, M) => { const l = B(p).L.get(L); return l ? (l.M.get(M) || 0) : 0; };
function hasP(p) { return S.m.periods.includes(p); }
function prevPeriods(p, n) { const out = []; for (let i = 1; i <= n; i++) { const q = addP(p, -i); if (!hasP(q)) break; out.push(q); } return out; }
function windowP(p, n) { const out = []; for (let i = n - 1; i >= 0; i--) { const q = addP(p, -i); if (hasP(q)) out.push(q); } return out; }

// 期間が途中かどうか（今日がまだ期間内）
function asOf(p) {
  const [a, b] = pRange(p); const t = dateOf(todayStr());
  if (t > b) return null;
  if (t < a) return 0;
  return Math.round((t - a) / DAY) + 1; // 経過日数

/* -------------------------------------------------------------- storage */
const toArr = r => [r.id, r.d, r.c, r.a, r.inst, r.L, r.M, r.memo, r.t, r.f];
const toObj = a => ({ id: a[0], d: a[1], c: a[2], a: a[3], inst: a[4], L: a[5], M: a[6], memo: a[7] || '', t: a[8], f: a[9] });
const enc = new TextEncoder();

const LocalStore = {
  name: 'local',
  label: 'このブラウザに保存',
  async init() {
    const raw = lsGet(APP_KEY);
    if (raw && raw.months) for (const k in raw.months) S.months[k] = raw.months[k].map(toObj);
    if (raw && raw.settings) S.settings = Object.assign(defaultSettings(), raw.settings);
    S.loaded = true; onData();
  },
  persist() {
    const months = {}; for (const k in S.months) months[k] = S.months[k].map(toArr);
    if (!lsSet(APP_KEY, { months, settings: S.settings })) toast('このブラウザに保存できませんでした（容量またはプライベートモード）。表示中のデータは閉じると消えます。');
  },
  async saveMonths() { this.persist(); },
  async saveSettings() { this.persist(); },
};

const CloudStore = {
  name: 'cloud',
  label: 'クラウド保存・PC/スマホ共通',
  db: null, gotLedger: false, gotCfg: false,
  async init(db) {
    this.db = db;
    db.collection('ledger').onSnapshot(snap => {
      const by = {}, parts = {};
      for (const d of snap.docs) {
        const x = d.data(); if (!x || !x.m) continue;
        (by[x.m] = by[x.m] || []).push(x); parts[x.m] = Math.max(parts[x.m] || 0, (x.part || 0) + 1);
      }
      const months = {};
      for (const k in by) months[k] = by[k].sort((a, b) => a.part - b.part).flatMap(x => x.rows.map(toObj));
      S.months = months; S.parts = parts; this.gotLedger = true; this.ready();
    }, e => { toast('クラウドのデータを読めませんでした（' + e.code + '）。'); this.gotLedger = true; this.ready(); });
    db.doc('config/settings').onSnapshot(snap => {
      if (snap.exists) S.settings = Object.assign(defaultSettings(), snap.data());
      this.gotCfg = true; this.ready();
    }, () => { this.gotCfg = true; this.ready(); });
  },
  ready() { if (this.gotLedger && this.gotCfg) { S.loaded = true; onData(); } },
  async saveMonths(keys) {
    for (const m of keys) {
      const rows = (S.months[m] || []).map(toArr);
      const chunks = []; let cur = [], size = 0;

    const { changed: ch, stat } = mergeRows(rows, range);
    ch.forEach(m => changed.add(m));
    lines.push(`${range[0].replace(/-/g, '/')}〜${range[1].slice(5).replace('-', '/')}: ${stat.n}件（新規${stat.add}・更新${stat.upd}・削除${stat.del}）`);

// 折れ線（累積ペース）。lines: [{label,color,values,width,emph}]

  for (const t of ticks) {

  const xl = sv('line', { x1: 0, x2: 0, y1: m.t, y2: m.t + ph, class: 'xhair', opacity: 0 });

  };

}
